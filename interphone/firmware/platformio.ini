; Interphone door controller firmware
; Envs:
;   esp32devkit  - ESP32 DevKit V1 (30-pin, WROOM-32)  <- primary, matches the shopping list
;   esp32s3      - ESP32-S3-DevKitC-1 (original design, kept as alternate)
;   native       - runs door_controller/buzzer unit tests on your laptop (pio test -e native)
;
; Wi-Fi / device credentials: copy secrets.ini.example to secrets.ini (git-ignored).
; Without secrets.ini the defaults in src/config.h apply (Wokwi-GUEST, no device token),
; which is exactly what you want for the Wokwi simulation.

[platformio]
default_envs = esp32devkit
extra_configs = secrets*.ini

; Overridden by secrets.ini when present (see secrets.ini.example).
[secrets]
build_flags =

[env]
build_flags =
    -DINTERPHONE_VERSION=\"0.1.0\"
    -Wall
test_framework = unity

[esp32common]
framework = arduino
platform = espressif32
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
build_src_filter = +<*> -<.git/>

[env:esp32devkit]
extends = esp32common
board = esp32doit-devkit-v1
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -DBOARD_DEVKIT_V1
    ${secrets.build_flags}

[env:esp32s3]
extends = esp32common
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    ${secrets.build_flags}

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -std=c++17
; Only the hardware-independent logic is compiled for the laptop.
build_src_filter = +<door_controller.cpp> +<buzzer.cpp>
test_build_src = yes
